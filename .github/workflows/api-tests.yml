name: API Regression Testing Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Initialize Python Environment Matrix
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Synchronize Package Requirements Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute PyTest Automation Core Regression Suite
      run: |
        export PYTHONPATH=.
        pytest
